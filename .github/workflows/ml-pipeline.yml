# ==============================================================================
# ML Pipeline: Train, Evaluate, Register Model
# Triggered manually or on changes to training code/data
# ==============================================================================
name: ML Pipeline

on:
  workflow_dispatch:
    inputs:
      run_training:
        description: 'Run full training pipeline'
        required: true
        default: 'true'
        type: boolean
      promote_model:
        description: 'Promote model to Production'
        required: false
        default: 'false'
        type: boolean
  push:
    branches: [main]
    paths:
      - 'src/phishing/mlops/**'
      - 'params.yaml'
      - 'dvc.yaml'
      - 'data/**'

env:
  PYTHON_VERSION: "3.11"
  ENVIRONMENT: "production"

jobs:
  validate-data:
    name: Validate Data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-mlops.txt

      - name: Run data validation
        run: python -m src.phishing.mlops.data_validation
        continue-on-error: true

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: data-validation-report
          path: reports/data_validation_report.json

  train:
    name: Train Model
    runs-on: ubuntu-latest
    needs: validate-data
    if: ${{ github.event.inputs.run_training == 'true' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-mlops.txt

      - name: Train model
        run: python -m src.phishing.mlops.train

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            models/phishing_rf_model.pkl
            models/scaler.pkl
            models/metrics.json

      - name: Upload training plots
        uses: actions/upload-artifact@v4
        with:
          name: training-plots
          path: reports/plots/

  evaluate:
    name: Evaluate Model
    runs-on: ubuntu-latest
    needs: train
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-mlops.txt

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: models/

      - name: Evaluate model
        run: python -m src.phishing.mlops.evaluate

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: |
            reports/evaluation_metrics.json
            reports/evaluation_plots/

  monitor:
    name: Monitor Drift
    runs-on: ubuntu-latest
    needs: evaluate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-mlops.txt

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: models/

      - name: Run drift monitoring
        run: python -m src.phishing.mlops.monitor

      - name: Upload drift report
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: |
            reports/drift_report.html
            reports/drift_metrics.json

  deploy:
    name: Deploy Model
    runs-on: ubuntu-latest
    needs: [evaluate, monitor]
    if: ${{ github.event.inputs.promote_model == 'true' }}
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-mlops.txt

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: models/

      - name: Download evaluation report
        uses: actions/download-artifact@v4
        with:
          name: evaluation-report
          path: reports/

      - name: Promote model to Production
        run: python -m src.phishing.mlops.promote --action promote --stage Production
